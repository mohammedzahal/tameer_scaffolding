<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TAMEER Scaffolding{% endblock %}</title>
    <!-- Google Fonts & Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Minimalist Header -->
    <header class="app-header sticky-top">
        <div class="container-xl px-4 py-2 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('home') }}" class="d-flex align-items-center gap-2 text-decoration-none">
                    <span class="brand-badge">TMR</span>
                    <span class="fw-bold text-dark tracking-tight" style="font-size: 1.05rem;">TAMEER</span>
                    <span class="text-muted fw-normal d-none d-sm-inline" style="font-size: 0.85rem;">Scaffolding</span>
                </a>
                
                <nav class="d-none d-md-flex align-items-center gap-1 ms-3">
                    <a href="{{ url_for('home') }}" class="nav-link-custom {% if active_page == 'dashboard' %}active{% endif %}">
                        Quotations
                    </a>
                    <a href="{{ url_for('settings') }}" class="nav-link-custom {% if active_page == 'settings' %}active{% endif %}">
                        Catalog (136 Items)
                    </a>
                </nav>
            </div>

            <div class="d-flex align-items-center gap-2">
                <a href="{{ url_for('settings') }}" class="btn btn-secondary-tmr btn-sm d-md-none">
                    Catalog
                </a>
                <button class="btn btn-primary-tmr" data-bs-toggle="modal" data-bs-target="#addLeadModal">
                    <i class="bi bi-plus-lg"></i>
                    <span>New Quote</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Quick Add Lead Modal -->
    <div class="modal fade" id="addLeadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-sm" style="border-radius: 12px;">
                <form action="{{ url_for('add_lead') }}" method="POST">
                    <div class="modal-header border-bottom px-4 py-3">
                        <h6 class="modal-title fw-bold text-dark">Create New Quotation Lead</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label">Client / Company Name *</label>
                            <input type="text" class="form-control" name="company_name" placeholder="e.g. Makana Industrial Services Co.Ltd." required autofocus>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Location / City</label>
                                <input type="text" class="form-control" name="location" value="Jubail, Kingdom of Saudi Arabia">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Site / Project Name</label>
                                <input type="text" class="form-control" name="site_name" placeholder="Optional">
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label">Attn (Contact Person)</label>
                                <input type="text" class="form-control" name="attn" placeholder="e.g. Mr. Ahmed">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Phone / Mobile</label>
                                <input type="text" class="form-control" name="tel" placeholder="05XXXXXXXX">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light px-4 py-2 border-top" style="border-radius: 0 0 12px 12px;">
                        <button type="button" class="btn btn-secondary-tmr btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-tmr btn-sm">Create & Start Quote &rarr;</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
